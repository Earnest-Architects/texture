<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seamless Texture Studio</title>
<meta name="theme-color" content="#eef3f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles/app.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <div><b>Seamless Texture Studio</b><small>シームレステクスチャをローカルで作成・確認・書き出し。画像は端末の外に出ません。</small></div>
  <div class="hb"><button id="inst" class="ghost" hidden>インストール</button><button id="hbtn" class="ghost">履歴</button></div>
</header>

<main>
  <section class="view" id="v-studio">
    <div class="glass drop" id="drop">
      <h1>画像をここにドロップ</h1>
      <p>PNG、JPG、WebP、BMP、GIF に対応</p>
      <button id="pick" class="primary">画像を選択</button>
      <input id="file" type="file" accept="image/*" hidden>
      <div id="pv"><span>プレビュー</span><img id="thumb" alt="元画像のプレビュー" hidden></div>
      <p id="meta" class="note">画像が選択されていません</p>
    </div>
    <div class="glass panel">
      <h2>メソッドを選択</h2>
      <div class="methods" id="methods" role="tablist"></div>
      <p id="about" class="note"></p>
      <div id="params"></div>
      <div class="row"><button id="rst" class="ghost">設定をリセット</button><button id="go" class="primary" disabled>テクスチャを作成</button></div>
    </div>
  </section>

  <section class="view" id="v-load">
    <div class="glass center">
      <h2 id="lt">ピクセルを読み込み中</h2>
      <div class="bar"><i id="lb"></i></div>
      <p id="lp">0%</p>
      <p class="note">カーソルを動かすと粒子が反応します。</p>
    </div>
  </section>

  <section class="view" id="v-result">
    <div class="glass bar2">
      <button id="back" class="ghost">戻る</button>
      <div class="modes" id="modes">
        <button data-n="1">結果</button><button data-n="3" class="on">タイル 3×3</button><button data-n="5">5×5</button><button data-n="7">7×7</button><button data-n="0" id="mcmp">比較</button>
      </div>
    </div>
    <div class="stage glass" id="stage">
      <canvas id="tc"></canvas>
      <div id="cmp" hidden><img id="ia" alt="結果"><img id="ib" alt="元画像"><input id="cr" type="range" min="0" max="100" value="50" aria-label="元画像と結果の比較スライダー"></div>
    </div>
    <div class="glass side">
      <h2>確認と書き出し</h2>
      <p id="diag" class="note"></p>
      <p class="note">タイルプレビューは結果のピクセルをそのまま繰り返しており、追加の補正はしていません。見た目が滑らかでも、すべての画像で完全に継ぎ目がなくなるとは限りません。</p>
      <label>形式 <select id="fmt"><option value="png">PNG(可逆)</option><option value="jpeg">JPEG</option></select></label>
      <label id="ql" hidden>JPEG 品質 <input id="q" type="range" min="50" max="100" value="95"><output id="qo">95</output></label>
      <p id="fnote" class="note" hidden>JPEG は透明度を保持できないため、透明部分は白背景で塗りつぶされます。</p>
      <p id="dim" class="note"></p>
      <button id="exp" class="primary">テクスチャを書き出す</button>
    </div>
  </section>
</main>

<aside id="hist" class="glass" aria-label="履歴">
  <div class="row"><h2>履歴</h2><button id="hclr" class="ghost">すべて削除</button></div>
  <ul id="hl"></ul>
</aside>
<div id="toast" role="status"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
